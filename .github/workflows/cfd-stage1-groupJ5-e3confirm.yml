# Group J5 (17 Oct 2026): confirm the E3 ram-collar result of J3 (bed pressure drop 4.51 Pa against 1.34 Pa
# for the J1 skirt baseline; neither passed every convergence gate). Both cases again, (a) run twice as
# long on the same mesh and (b) on a mesh one level finer. 4 jobs.
name: cfd-stage1-groupJ5-e3confirm
on:
  workflow_dispatch:
env:
  ROOT: cvwt-upload-to-github/cfd/stage1
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case:
          - J1_CEM_t18_U4_az000_open_solid_medium_b34s16_x12_r100
          - J3_CEM_t18_U4_az000_open_solid_medium_b34s16_x12_e3
        check:
          - long      # same mesh, 3000 iterations instead of 1500
          - fine      # one refinement level finer everywhere, 2500 iterations

    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFOAM 12
        run: |
          sudo sh -c "wget -qO - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update -qq && sudo apt-get install -y openfoam12
      - name: Build the skirt geometry
        run: |
          python3 -m pip install --quiet numpy
          cd geometry
          python3 build_intake.py sealed_base
          for r in 100 140; do python3 build_skirt.py "$r" 0.30; done
          python3 build_skirt_elevated.py
        working-directory: ${{ env.ROOT }}
      - name: Guard the geometry and the cassette before spending a mesh
        run: python3 tests/test_skirt.py
        working-directory: ${{ env.ROOT }}
      - name: Mesh and solve ${{ matrix.case }}
        run: |
          set +e
          source /opt/openfoam12/etc/bashrc
          set -e
          python3 make_sweep.py --create --only=${{ matrix.case }}
          cd runs/${{ matrix.case }}
          if [ "${{ matrix.check }}" = fine ]; then
            foamDictionary system/caseParams -entry LVL   -set 5
            foamDictionary system/caseParams -entry LVL_1 -set 4
            foamDictionary system/caseParams -entry LVL_2 -set 3
            foamDictionary system/caseParams -entry LVL_3 -set 2
            foamDictionary system/controlDict -entry endTime -set 2500
          else
            foamDictionary system/caseParams -entry LVL   -set 4
            foamDictionary system/caseParams -entry LVL_1 -set 3
            foamDictionary system/caseParams -entry LVL_2 -set 2
            foamDictionary system/caseParams -entry LVL_3 -set 1
            foamDictionary system/controlDict -entry endTime -set 3000
          fi
          chmod +x Allrun
          set +e
          ./Allrun --run 1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::case failed (rc=$rc)"
            for l in log.snappyHexMesh log.topoSet log.checkMesh log.foamRun; do
              [ -f "$l" ] && { echo "---- tail of $l ----"; tail -30 "$l"; }
            done
            exit $rc
          fi
          grep -m1 -E "^\s*cells:" log.checkMesh || true
        working-directory: ${{ env.ROOT }}/sweep
      - name: Summary and acceptance gates
        if: always()
        run: |
          python3 summarize_run.py runs/${{ matrix.case }} || true
          # the two checks of a case share its folder name: rename so collect keeps both
          mv runs/${{ matrix.case }} runs/${{ matrix.case }}_${{ matrix.check }}
        working-directory: ${{ env.ROOT }}/sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groupJ5-${{ matrix.case }}-${{ matrix.check }}
          path: |
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/log.*
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/run_summary.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/case_params.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/postProcessing/**
          retention-days: 30
