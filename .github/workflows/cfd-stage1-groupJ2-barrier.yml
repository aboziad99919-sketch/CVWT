# Group J2: the open steel median barrier (Rev C). The impact check puts the CVWT behind a vehicle
# restraint system; this measures what an open W-beam on posts, 1.0 m outside the skirt, costs the
# filter flow. Same case as J1 CEM r100 (1851 L/min, the reference) plus the barrier:
#   barpar  - rails along the wind (wind along the road, as in group J)
#   barperp - rails across the wind (crosswind over one barrier into the skirt): the worst case
# Two jobs in parallel, ~same time as group J. Manual trigger.
name: cfd-stage1-groupJ2-barrier
on:
  workflow_dispatch:
env:
  ROOT: cvwt-upload-to-github/cfd/stage1
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 400
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case:
          - J2_CEM_t18_U4_az000_open_solid_medium_b34s16_x12_r100_barpar
          - J2_CEM_t18_U4_az000_open_solid_medium_b34s16_x12_r100_barperp

    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFOAM 12
        run: |
          sudo sh -c "wget -qO - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update -qq && sudo apt-get install -y openfoam12
      - name: Build the skirt geometry
        run: |
          python3 -m pip install --quiet numpy
          cd geometry
          python3 build_intake.py sealed_base
          for r in 100 140; do python3 build_skirt.py "$r" 0.30; done
          python3 build_barrier.py
        working-directory: ${{ env.ROOT }}
      - name: Guard the geometry and the cassette before spending a mesh
        run: python3 tests/test_skirt.py
        working-directory: ${{ env.ROOT }}
      - name: Mesh and solve ${{ matrix.case }}
        run: |
          set +e
          source /opt/openfoam12/etc/bashrc
          set -e
          python3 make_sweep.py --create --only=${{ matrix.case }}
          cd runs/${{ matrix.case }}
          foamDictionary system/caseParams -entry LVL   -set 4
          foamDictionary system/caseParams -entry LVL_1 -set 3
          foamDictionary system/caseParams -entry LVL_2 -set 2
          foamDictionary system/caseParams -entry LVL_3 -set 1
          foamDictionary system/controlDict -entry endTime -set 1500
          chmod +x Allrun
          set +e
          ./Allrun --run 1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::case failed (rc=$rc)"
            for l in log.snappyHexMesh log.topoSet log.checkMesh log.foamRun; do
              [ -f "$l" ] && { echo "---- tail of $l ----"; tail -30 "$l"; }
            done
            exit $rc
          fi
          grep -m1 -E "^\s*cells:" log.checkMesh || true
        working-directory: ${{ env.ROOT }}/sweep
      - name: Summary and acceptance gates
        if: always()
        run: python3 summarize_run.py runs/${{ matrix.case }} || true
        working-directory: ${{ env.ROOT }}/sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groupJ2-${{ matrix.case }}
          path: |
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/log.*
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/run_summary.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/case_params.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/postProcessing/**
          retention-days: 30
