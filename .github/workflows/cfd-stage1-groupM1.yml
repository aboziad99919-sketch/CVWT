# Group M1: grid convergence. The one verification the study still lacks.
#
# Every number in stage 1 so far comes from ONE mesh - and not the "medium" mesh the plan specifies
# (level 5, ~3.5 M cells) but the coarse screening mesh every workflow drops to (level 4, ~0.86 M).
# So the discretisation error is currently unknown, and it could be larger than both the +-1-8 %
# oscillation band and the 0.43 % replication spread that group FS2 established. Until this runs,
# a reviewer can reject the whole study on one sentence. That is why it goes before the report.
#
# Three meshes of the SAME case - R4_F2, the sealed-core Oe68 design baseline - with every
# snappyHexMesh level dropped by one between them, so the cell size doubles each step and the
# refinement ratio is a clean ~2:
#
#   m1c  coarse  levels 3/2/1/0   ~0.18 M cells  serial
#   m1m  medium  levels 4/3/2/1   0.864 M cells  serial   <- identical to every other run so far,
#                                                            so it doubles as a reproducibility check
#                                                            against R4_F2 itself (it passed: it
#                                                            reproduced R4_F2 digit for digit)
#   m1f  fine    levels 5/4/3/2   4.144 M cells  4-way MPI <- the plan's intended mesh, run at last
#
# Measured cell ratio fine:medium is 4.80, so h falls by 1.687 per level - not 2, because only the
# refined regions change. gci.py takes the ratio from the cell counts, so this is handled.
#
# R4_F2 is the right case for this: its core is UNPERFORATED, so there are no 5 mm holes that the
# coarse mesh would fail to resolve at all. The bed and the 6 mm outlet slots are the features that
# matter, and the coarse mesh still gets ~2.4 cells across a slot - thin, which is the point of a
# coarse leg, but not degenerate. If snappy loses the outletFilter patch entirely, Allrun exits 4
# and that leg reports as failed rather than as a number; fail-fast is off so the others continue.
#
# The fine leg runs under mpirun -np 4 (the runner has 4 vCPU) because 3.5 M cells serial for 2000
# iterations would sit near the 6-hour job ceiling. Allrun handles decomposePar/reconstructPar and
# keeps numberOfSubdomains in step with the mpirun width.
#
# The gci job then computes the observed order of accuracy and the Grid Convergence Index per
# ASME V&V 20, on WINDOW MEANS rather than last-instant values - a GCI built on instantaneous
# values would measure vortex shedding, not the mesh.
name: cfd-stage1-groupM1
on:
  workflow_dispatch:
env:
  ROOT: cvwt-upload-to-github/cfd/stage1
  CASE: R4_F2_t18_U4_az000_open_solid_medium_b34s16
jobs:
  mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 350          # the fine leg needs ~3 h serial; the others ~45 min
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # The fine leg is 4,144,355 cells - 4.8x the medium mesh, not the ~3.5 M the plan
          # estimated. Serial it did NOT finish 1500 iterations in 5 h 48 m, so serial is 6-9 h and
          # cannot fit the 6 h job ceiling. Four ranks brings it to ~2 h, so MPI has to work.
          #
          # The diagnostics finally said why it did not: nproc=4, cores=4, OpenMPI 4.1.6 present.
          # So it was never oversubscription - the earlier failures were decomposePar itself, and
          # the remaining suspect is "method scotch", whose library the openfoam12 package does not
          # reliably carry. This leg now writes its own decomposeParDict using HIERARCHICAL
          # decomposition, which is built into OpenFOAM and needs no external library. If that
          # still fails, the step falls back to serial at 600 iterations rather than burning the
          # whole 6 h ceiling for nothing.
          - tag: m1f
            lvl: 5
            iters: 1500
            np: 4
          - tag: m1m
            lvl: 4
            iters: 1500
            np: 1
          - tag: m1c
            lvl: 3
            iters: 1500
            np: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFOAM 12
        run: |
          sudo sh -c "wget -qO - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update -qq && sudo apt-get install -y openfoam12
      - name: Mesh and solve at level ${{ matrix.lvl }} (${{ matrix.tag }})
        env:
          # A GitHub runner reports 4 vCPU but only 2 physical CORES, and OpenMPI 4 maps by core by
          # default - so "mpirun -np 4" is refused with "not enough slots available" within seconds
          # of the job starting, which is exactly how the fine leg failed on run #1. These let it
          # oversubscribe. The first is OpenMPI 4, the second PRRTE (OpenMPI 5); setting both is
          # harmless and covers whichever the openfoam12 package pulls in.
          OMPI_MCA_rmaps_base_oversubscribe: "true"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
        run: |
          set +e
          source /opt/openfoam12/etc/bashrc
          set -e
          # Print the parallel environment BEFORE anything can fail, so a failed leg diagnoses
          # itself instead of costing a round trip to ask for the log.
          echo "nproc=$(nproc)  cores=$(lscpu -p=CORE 2>/dev/null | grep -vc '^#')  np=${{ matrix.np }}"
          command -v mpirun && mpirun --version 2>&1 | head -2 || echo "mpirun NOT FOUND"
          python3 make_sweep.py --create --only=$CASE
          mv runs/$CASE runs/${CASE}_${{ matrix.tag }}
          cd runs/${CASE}_${{ matrix.tag }}
          # the whole experiment: all four levels shifted together, so h scales uniformly
          foamDictionary system/caseParams -entry LVL   -set ${{ matrix.lvl }}
          foamDictionary system/caseParams -entry LVL_1 -set $(( ${{ matrix.lvl }} - 1 ))
          foamDictionary system/caseParams -entry LVL_2 -set $(( ${{ matrix.lvl }} - 2 ))
          foamDictionary system/caseParams -entry LVL_3 -set $(( ${{ matrix.lvl }} - 3 ))
          foamDictionary system/controlDict -entry endTime -set ${{ matrix.iters }}
          chmod +x Allrun
          if [ "${{ matrix.np }}" -gt 1 ]; then
            # Written whole rather than edited: scotch needs a library the package may not carry,
            # hierarchical is built in. Both coeff spellings are given because OpenFOAM renamed the
            # dictionary between versions and ignores whichever it does not read.
            cat > system/decomposeParDict <<'DPD'
            FoamFile { format ascii; class dictionary; object decomposeParDict; }
            numberOfSubdomains ${{ matrix.np }};
            method             hierarchical;
            coeffs             { n (2 2 1); delta 0.001; order xyz; }
            hierarchicalCoeffs { n (2 2 1); delta 0.001; order xyz; }
          DPD
            # keep a pristine copy so a failed parallel attempt can retry serially
            cp -r . ../fallback_${{ matrix.tag }}
          fi
          set +e
          ./Allrun --run ${{ matrix.np }}
          rc=$?
          set -e
          if [ $rc -ne 0 ] && [ "${{ matrix.np }}" -gt 1 ]; then
            echo "::warning::parallel run failed (rc=$rc); falling back to serial at 600 iterations"
            for l in log.decomposePar log.snappyHexMesh log.foamRun; do
              [ -f "$l" ] && { echo "---- tail of $l ----"; tail -25 "$l"; }
            done
            cd ..
            rm -rf ${CASE}_${{ matrix.tag }}
            mv fallback_${{ matrix.tag }} ${CASE}_${{ matrix.tag }}
            cd ${CASE}_${{ matrix.tag }}
            # 600 iterations is what fits serially; check_stability.py will say whether it settled
            foamDictionary system/controlDict -entry endTime -set 600
            ./Allrun --run 1
          elif [ $rc -ne 0 ]; then
            exit $rc
          else
            rm -rf ../fallback_${{ matrix.tag }}
          fi
          grep -m1 -E "^\s*cells:" log.checkMesh || true
          # checkMesh reported failed checks on the level-5 mesh; say WHICH, so it is a finding
          # rather than a warning nobody can act on.
          grep -B2 -A6 "Failed.*mesh checks" log.checkMesh || echo "checkMesh: no failed checks"
        working-directory: ${{ env.ROOT }}/sweep
      - name: Summary and acceptance gates
        if: always()
        run: python3 summarize_run.py runs/${CASE}_${{ matrix.tag }} || true
        working-directory: ${{ env.ROOT }}/sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groupM1-${{ matrix.tag }}
          path: |
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/log.*
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/run_summary.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/postProcessing/**
          retention-days: 30

  gci:
    needs: mesh
    if: always()                 # report on whatever legs finished; gci.py says what is missing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: groupM1-*
          path: dl
      - name: Flatten the three legs into runs/
        run: |
          set -e
          mkdir -p runs
          while IFS= read -r f; do
            d=$(dirname "$f"); c=$(basename "$d")
            mkdir -p "runs/$c"
            cp "$f" "runs/$c/"
            [ -f "$d/log.foamRun" ] && cp "$d/log.foamRun" "runs/$c/"
            [ -d "$d/postProcessing" ] && cp -r "$d/postProcessing" "runs/$c/"
          done < <(find dl -name run_summary.json)
          ls runs
      - name: Grid convergence index
        run: |
          set -e
          G=$(find . -name gci.py -not -path "./dl/*" | head -1)
          test -n "$G" || { echo "gci.py is not in the repo (expected $ROOT/sweep/)"; exit 1; }
          python3 "$G" runs 500 | tee gci.txt
      - name: Quantity stability on the three meshes
        if: always()
        run: |
          S=$(find . -name check_stability.py -not -path "./dl/*" | head -1)
          if [ -n "$S" ]; then python3 "$S" runs 500 | tee stability.txt; fi
      - name: Put it in the run summary
        if: always()
        run: |
          {
            echo '## Grid convergence (group M1)'
            echo '```'
            cat gci.txt
            echo '```'
            echo '### Quantity stability on each mesh'
            echo '```'
            tail -c 20000 stability.txt 2>/dev/null || echo "(not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groupM1-gci
          path: |
            gci.txt
            stability.txt
          retention-days: 90
