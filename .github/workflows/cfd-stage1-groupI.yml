# Group I: the intake redesign.
#
# WHY THIS EXISTS. Every stage-1 case so far drew air through slots cut down through the base dish,
# both mount plates and the median plate, venting at z = -25 mm to "still room air". That is true on
# a test bench, where there is air under the median plate. On a road median the base sits on ground:
# there is no reservoir down there and the path does not exist. The slot outlet was always a
# placeholder (geometry issue G1) and this group replaces it. The flow numbers from groups A-FS are
# not wrong - the internal resistances are unchanged - but the SOURCE of the air was not buildable.
#
# WHAT REPLACES IT. An annular slot through the housing wall into the plenum below the bed:
#   * omnidirectional - traffic wind alternates with the lane, so a facing intake works half the time
#   * 1357 mm2 at 6 mm height, against 467 mm2 for the old slot plate
#   * axisymmetric, so it is a revolution and meshes cleanly, and a grit screen is a ring too
#
# THE 100 mm QUESTION. The user asked for the intake to sit at least 100 mm above the deck, to get
# above road grit. The D1 rake already measured what is up there: -5.93 Pa at z = 100 against
# -7.63 Pa in the bore, so only ~1.7 Pa of the 7.63 Pa the circuit works on today would remain -
# about 29 % of the flow on the system curve fitted to groups R3/R4. The shroud variants carry the
# mouth to 85 and 115 mm through a concentric sleeve so that cost is MEASURED, not argued. If the
# penalty comes out smaller than the rake predicts, the sleeve is recovering some dynamic pressure
# and a proper ram scoop becomes worth designing; if it matches, the intake has to stay low and grit
# is a screen-and-settling-volume problem instead.
#
# WHAT IS DIFFERENT TO RUN. Two things, and both are new code paths that have never executed:
#   1. there is no outletFilter PATCH any more, so flow is measured on a cut plane through the bore
#      (same function-object name Q_outletFilter, so every downstream parser is unchanged);
#   2. Allrun's "slots not resolved" check cannot apply, and is skipped via system/INTERNAL_INTAKE.
# If a leg dies immediately after meshing it is almost certainly the sampledSurface dictionary, so
# the step prints the tail of log.foamRun on failure to make the next attempt cheap.
#
# 6 cases, coarse screening mesh, serial, ~45 min each.
name: cfd-stage1-groupI
on:
  workflow_dispatch:
env:
  ROOT: cvwt-upload-to-github/cfd/stage1
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case:
          - I1_F2_t18_U4_az000_open_solid_medium_b34s16_slot14_h6
          - I1_F2_t18_U4_az000_open_solid_medium_b34s16_slot20_h6
          - I1_F2_t18_U4_az000_open_solid_medium_b34s16_slot14_h12
          - I1_F2_t18_U4_az000_open_solid_medium_b34s16_shroud70
          - I1_F2_t18_U4_az000_open_solid_medium_b34s16_shroud100
          - I1_F2_t18_U4_az000_open_solid_medium_b34s16_shroud100_wide
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFOAM 12
        run: |
          sudo sh -c "wget -qO - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update -qq && sudo apt-get install -y openfoam12
      - name: Build the intake geometry
        run: |
          python3 -m pip install --quiet numpy
          cd geometry
          for v in sealed_base slot14_h6 slot20_h6 slot14_h12 shroud70 shroud100 shroud100_wide; do
            python3 build_intake.py "$v"
          done
        working-directory: ${{ env.ROOT }}
      - name: Guard the geometry before spending a mesh on it
        run: python3 tests/test_intake.py
        working-directory: ${{ env.ROOT }}
      - name: Mesh and solve ${{ matrix.case }}
        run: |
          set +e
          source /opt/openfoam12/etc/bashrc
          set -e
          python3 make_sweep.py --create --only=${{ matrix.case }}
          cd runs/${{ matrix.case }}
          foamDictionary system/caseParams -entry LVL   -set 4
          foamDictionary system/caseParams -entry LVL_1 -set 3
          foamDictionary system/caseParams -entry LVL_2 -set 2
          foamDictionary system/caseParams -entry LVL_3 -set 1
          foamDictionary system/controlDict -entry endTime -set 1500
          chmod +x Allrun
          set +e
          ./Allrun --run 1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::case failed (rc=$rc)"
            for l in log.snappyHexMesh log.topoSet log.checkMesh log.foamRun; do
              [ -f "$l" ] && { echo "---- tail of $l ----"; tail -30 "$l"; }
            done
            exit $rc
          fi
          grep -m1 -E "^\s*cells:" log.checkMesh || true
        working-directory: ${{ env.ROOT }}/sweep
      - name: Summary and acceptance gates
        if: always()
        run: python3 summarize_run.py runs/${{ matrix.case }} || true
        working-directory: ${{ env.ROOT }}/sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groupI-${{ matrix.case }}
          path: |
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/log.*
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/run_summary.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/case_params.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/postProcessing/**
          retention-days: 30
