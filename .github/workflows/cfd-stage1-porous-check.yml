# Porous-model verification on a 1-D duct: does OpenFOAM 12 apply the Ergun resistance we specify,
# for one layer and for a three-layer stack? ~5 minutes in total, manual trigger only.
#
# Why now: group J run #6 measured 0.74 Pa across the three-grade CEM cassette (area average)
# where the measured flow needs ~2.3 Pa by Ergun, and J1_F2 read 17 % low. Every earlier group
# matched Ergun within ~5 %. If these ducts pass, the porous model is right and the cause is in
# the group J flow path; if the stacks fail, it is in how multiple porous layers are applied.
name: cfd-stage1-porous-check
on:
  workflow_dispatch:
env:
  DUCT: cvwt-upload-to-github/cfd/stage1/tests/foam/porous_duct
jobs:
  duct:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # the original check: one 18 mm F2 bed at 0.06 m/s
          - name: f2_single
            U: "0.06"
            layers: "0.091:0.109:1.245e8:1.0563e4"
          # J1_F2: three 25 mm F2 layers at its measured face velocity
          - name: f2_three
            U: "0.0235"
            layers: "0.06:0.085:1.245e8:1.0563e4 0.085:0.11:1.245e8:1.0563e4 0.11:0.135:1.245e8:1.0563e4"
          # J1_CEM: C1 / C2 / C3, 25 mm each, at its measured face velocity
          - name: cem_three
            U: "0.082"
            layers: "0.06:0.085:1.105e6:364 0.085:0.11:5.324e6:841.4 0.11:0.135:4.541e7:2691"
          # the same cassette, single grade C3 only, to see whether one fine layer alone is right
          - name: c3_single
            U: "0.082"
            layers: "0.11:0.135:4.541e7:2691"
          # Resolution: the same C3 resistance (t*d, t*f identical) on 1, 2, 3 and 5 cells, and the
          # whole cassette meshed exactly as group J meshes it (2 / 2 / 1 rows of 15 mm, corrected).
          # Run #8 showed the one-row C3 there giving ~0.5 Pa where Ergun needs ~2 Pa.
          - name: c3_1cell
            U: "0.082"
            dx: "0.015"
            layers: "0.30:0.315:7.5683e7:4485"
          - name: c3_2cell
            U: "0.082"
            dx: "0.0125"
            layers: "0.30:0.325:4.541e7:2691"
          - name: c3_3cell
            U: "0.082"
            dx: "0.0075"
            layers: "0.30:0.3225:5.0456e7:2990"
          - name: c3_5cell
            U: "0.082"
            dx: "0.005"
            layers: "0.30:0.325:4.541e7:2691"
          - name: cem_as_groupJ
            U: "0.082"
            dx: "0.015"
            layers: "0.255:0.285:9.2083e5:303.33 0.285:0.315:4.4367e6:701.17 0.315:0.33:7.5683e7:4485"
          # The fix: the same cassette as ONE porous baffle (zero thickness, exact Ergun jump) on the
          # same coarse 15 mm cells that lost 72 % of its resistance as porous zones.
          # The fix that ships: the cassette's total resistance (sum t*d, sum t*f) spread over ONE
          # zone 315 mm / 21 cells thick (as group J: 324 mm / ~21 cells), on the same 15 mm cells that lost 72 % as thin layers.
          # (The zero-thickness baffle diverged at every relaxation tried, runs #6-#7.)
          - name: cem_thick
            U: "0.082"
            dx: "0.015"
            layers: "0.105:0.42:4.11421e+06:309.238"
          - name: f2_thick
            U: "0.0235"
            dx: "0.015"
            layers: "0.105:0.42:2.96429e+07:2515"
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFOAM 12
        run: |
          sudo sh -c "wget -qO - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update -qq && sudo apt-get install -y openfoam12
      - name: Run duct ${{ matrix.name }}
        run: |
          set +e
          source /opt/openfoam12/etc/bashrc
          set -e
          DX="${{ matrix.dx }}" BAFFLE="${{ matrix.baffle }}" RELAX="${{ matrix.relax }}" python3 make_variant.py "/tmp/${{ matrix.name }}" ${{ matrix.U }} ${{ matrix.layers }}
          cd "/tmp/${{ matrix.name }}"
          run() { "$@" > "log.$1" 2>&1 || { echo "FAILED: $*"; tail -40 "log.$1"; exit 1; }; }
          run blockMesh
          run topoSet
          if [ -f system/createBafflesDict ]; then
            run createBaffles -overwrite
            grep -E "cassette[01]" constant/polyMesh/boundary -A4 | grep -E "type|nFaces" || true
          fi
          run foamRun
          grep -E "Zone(Set)? (filter[0-9]+|cassette) now size" log.topoSet || true   # a baffle case has no filter zones
          set -o pipefail                       # a failed check must fail the job, not hide behind tee
          python3 verify.py | tee verify.txt
        working-directory: ${{ env.DUCT }}
      - name: Put it in the run summary
        if: always()
        run: |
          { echo "### duct ${{ matrix.name }}"; echo '```'; cat "/tmp/${{ matrix.name }}/verify.txt" 2>/dev/null || echo "(no result)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duct-${{ matrix.name }}
          path: |
            /tmp/${{ matrix.name }}/log.*
            /tmp/${{ matrix.name }}/verify.txt
            /tmp/${{ matrix.name }}/postProcessing/**
          retention-days: 30
