# Stage 2: the rotor turns. Steady MRF on R4_F2 (rig scale, sealed core, Ø68 bed) at six tip speed
# ratios, both directions, so one run gives the static torque, the direction the wind drives the
# rotor, and the speed where the torque falls to zero (the passive rotor's freewheel speed).
# Same screening mesh and iterations as R4_F2, serial, ~45 min each, in parallel. Manual trigger.
name: cfd-stage2-rotor
on:
  workflow_dispatch:
env:
  ROOT: cvwt-upload-to-github/cfd/stage1
jobs:
  rotor:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # Run 1 (lambda 0, +-0.2, +-0.4, +0.6): driven clockwise (lambda < 0), torque still driving at
        # -0.4. Run 2 extends the driven side to find where the torque crosses zero; lambda 0 and -0.4
        # are repeated so this run alone fixes the direction and overlaps run 1.
        case:
          - S2_F2_t18_U4_az000_open_solid_medium_b34s16_tsrp000
          - S2_F2_t18_U4_az000_open_solid_medium_b34s16_tsrm040
          - S2_F2_t18_U4_az000_open_solid_medium_b34s16_tsrm060
          - S2_F2_t18_U4_az000_open_solid_medium_b34s16_tsrm080
          - S2_F2_t18_U4_az000_open_solid_medium_b34s16_tsrm100
          - S2_F2_t18_U4_az000_open_solid_medium_b34s16_tsrm120
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFOAM 12
        run: |
          sudo sh -c "wget -qO - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update -qq && sudo apt-get install -y openfoam12
      - name: Mesh and solve ${{ matrix.case }}
        run: |
          set +e
          source /opt/openfoam12/etc/bashrc
          set -e
          python3 make_sweep.py --create --only=${{ matrix.case }}
          cd runs/${{ matrix.case }}
          foamDictionary system/caseParams -entry LVL   -set 4
          foamDictionary system/caseParams -entry LVL_1 -set 3
          foamDictionary system/caseParams -entry LVL_2 -set 2
          foamDictionary system/caseParams -entry LVL_3 -set 1
          foamDictionary system/controlDict -entry endTime -set 1500
          cat constant/MRFProperties
          chmod +x Allrun
          set +e
          ./Allrun --run 1
          rc=$?
          set -e
          grep -E "cellZoneSet rotor now size" log.topoSet || true
          if [ $rc -ne 0 ]; then
            echo "::error::case failed (rc=$rc)"
            for l in log.topoSet log.checkMesh log.foamRun; do
              [ -f "$l" ] && { echo "---- tail of $l ----"; tail -40 "$l"; }
            done
            exit $rc
          fi
        working-directory: ${{ env.ROOT }}/sweep
      - name: Summary and acceptance gates
        if: always()
        run: python3 summarize_run.py runs/${{ matrix.case }} || true
        working-directory: ${{ env.ROOT }}/sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-${{ matrix.case }}
          path: |
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/log.*
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/run_summary.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/case_params.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/constant/MRFProperties
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/postProcessing/**
          retention-days: 30

  torque:
    needs: rotor
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stage2-*
          path: dl
      - name: Torque against tip speed ratio
        run: |
          mkdir -p runs
          for d in dl/*/; do
            for c in "$d"*/; do [ -d "$c" ] && cp -r "$c" runs/; done
          done
          ls runs
          python3 cvwt-upload-to-github/cfd/stage1/sweep/torque_summary.py runs 500 | tee torque.txt
          { echo '## Stage 2 rotor sweep'; echo '```'; cat torque.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
