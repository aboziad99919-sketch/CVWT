# Group BP: the control for the group-B anomaly.
# Group B found core Cp NOT falling monotonically with bed thickness - the 36 mm cases showed the
# shallowest suction when less flow should give the deepest, consistently across F1, F2 and F3 and
# far outside the 0.4-0.9 % band. Geometry was cleared: the bed never overlaps the tube (starts at
# z = 58 mm, bed top 45 mm) and the housing bore is r = 17.0 mm at every height, so the r = 17.2 mm
# porous cylinder fills it with no bypass annulus.
# The remaining suspect is the parameterisation itself. In group B the bed hangs from a fixed top at
# 45 mm and grows downward, so a 36 mm bed starts 4 mm above the slot exits with no plenum to spread
# the three jets, while a 9 mm bed has 31 mm. Thickness and inlet-plenum length are confounded.
# Here the bed BOTTOM is pinned at 9 mm and the top varies, so every case has the same 4 mm plenum
# and thickness is varied alone. The 36 mm case is identical to its B1 twin and anchors the two sets.
# Read it as: Cp monotonic in thickness -> confounding confirmed, group B flows stand.
#            Cp still non-monotonic     -> another cause; withhold the 36 mm column.
# 9 cases, all in parallel, coarse mesh, serial solver. Manual trigger only.
name: cfd-stage1-groupBP
on:
  workflow_dispatch:
env:
  ROOT: cvwt-upload-to-github/cfd/stage1
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false          # one bad case must not cancel the other fifteen
      max-parallel: 8
      matrix:
        case:
          - BP_F1_t09_U4_az000_capped_holes_medium
          - BP_F1_t18_U4_az000_capped_holes_medium
          - BP_F1_t36_U4_az000_capped_holes_medium
          - BP_F2_t09_U4_az000_capped_holes_medium
          - BP_F2_t18_U4_az000_capped_holes_medium
          - BP_F2_t36_U4_az000_capped_holes_medium
          - BP_F3_t09_U4_az000_capped_holes_medium
          - BP_F3_t18_U4_az000_capped_holes_medium
          - BP_F3_t36_U4_az000_capped_holes_medium
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFOAM 12
        run: |
          sudo sh -c "wget -qO - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update -qq && sudo apt-get install -y openfoam12
      - name: Mesh and solve ${{ matrix.case }}
        run: |
          set +e
          source /opt/openfoam12/etc/bashrc
          set -e
          python3 make_sweep.py --create --only=${{ matrix.case }}
          cd runs/${{ matrix.case }}
          # screening mesh: drop every refinement level by one (medium -> coarse), ~0.6 M cells
          foamDictionary system/caseParams -entry LVL   -set 4
          foamDictionary system/caseParams -entry LVL_1 -set 3
          foamDictionary system/caseParams -entry LVL_2 -set 2
          foamDictionary system/caseParams -entry LVL_3 -set 1
          foamDictionary system/controlDict -entry endTime -set 1500
          chmod +x Allrun && ./Allrun --run
        working-directory: ${{ env.ROOT }}/sweep
      - name: Summary and acceptance gates
        if: always()
        run: python3 summarize_run.py runs/${{ matrix.case }} || true
        working-directory: ${{ env.ROOT }}/sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groupBP-${{ matrix.case }}
          path: |
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/log.*
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/run_summary.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/postProcessing/**
          retention-days: 30
