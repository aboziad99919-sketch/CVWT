# Group A screening: 16 cases, each in its own parallel job, coarse mesh, serial solver.
# Purpose: measure the core pressure at the holes (the pre-screen's biggest unknown) and the
# open-vs-capped bypass, before spending medium-mesh hours. Manual trigger only.
name: cfd-stage1-groupA
on:
  workflow_dispatch:
env:
  ROOT: cvwt-upload-to-github/cfd/stage1
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false          # one bad case must not cancel the other fifteen
      max-parallel: 8
      matrix:
        case:
          - A1_SEALED_t18_U4_az000_capped_holes_medium
          - A1_SEALED_t18_U4_az225_capped_holes_medium
          - A1_SEALED_t18_U4_az450_capped_holes_medium
          - A1_SEALED_t18_U4_az675_capped_holes_medium
          - A2_SEALED_t18_U2_az000_capped_holes_medium
          - A2_SEALED_t18_U4_az000_capped_holes_medium
          - A2_SEALED_t18_U6_az000_capped_holes_medium
          - A2_SEALED_t18_U2_az000_open_holes_medium
          - A2_SEALED_t18_U4_az000_open_holes_medium
          - A2_SEALED_t18_U6_az000_open_holes_medium
          - A2_F0_t18_U2_az000_capped_holes_medium
          - A2_F0_t18_U4_az000_capped_holes_medium
          - A2_F0_t18_U6_az000_capped_holes_medium
          - A2_F0_t18_U2_az000_open_holes_medium
          - A2_F0_t18_U4_az000_open_holes_medium
          - A2_F0_t18_U6_az000_open_holes_medium
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFOAM 12
        run: |
          sudo sh -c "wget -qO - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update -qq && sudo apt-get install -y openfoam12
      - name: Mesh and solve ${{ matrix.case }}
        run: |
          set +e
          source /opt/openfoam12/etc/bashrc
          set -e
          python3 make_sweep.py --create --only=${{ matrix.case }}
          cd runs/${{ matrix.case }}
          # screening mesh: drop every refinement level by one (medium -> coarse), ~0.6 M cells
          foamDictionary system/caseParams -entry LVL   -set 4
          foamDictionary system/caseParams -entry LVL_1 -set 3
          foamDictionary system/caseParams -entry LVL_2 -set 2
          foamDictionary system/caseParams -entry LVL_3 -set 1
          foamDictionary system/controlDict -entry endTime -set 1500
          chmod +x Allrun && ./Allrun --run
        working-directory: ${{ env.ROOT }}/sweep
      - name: Summary and acceptance gates
        if: always()
        run: python3 summarize_run.py runs/${{ matrix.case }} || true
        working-directory: ${{ env.ROOT }}/sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: groupA-${{ matrix.case }}
          path: |
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/log.*
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/run_summary.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/postProcessing/**
          retention-days: 30
