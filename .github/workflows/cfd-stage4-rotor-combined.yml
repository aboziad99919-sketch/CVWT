# Stage 4: the stage 3 winners combined (c1 3 fins/240/80, c2 3/360/80, c3 2/360/80, c4 3/240/38).
# Each at lambda -0.3/-0.5/-0.7 (power curve) and two more azimuths at -0.5 (ripple). 20 jobs.
name: cfd-stage4-rotor-combined
on:
  workflow_dispatch:
env:
  ROOT: cvwt-upload-to-github/cfd/stage1
jobs:
  rotor:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        case:
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc1_tsrm030
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc1_tsrm050
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc1_tsrm070
          - S4_F2_t18_U4_az400_open_solid_medium_b34s16_rotc1_tsrm050
          - S4_F2_t18_U4_az800_open_solid_medium_b34s16_rotc1_tsrm050
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc2_tsrm030
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc2_tsrm050
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc2_tsrm070
          - S4_F2_t18_U4_az400_open_solid_medium_b34s16_rotc2_tsrm050
          - S4_F2_t18_U4_az800_open_solid_medium_b34s16_rotc2_tsrm050
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc3_tsrm030
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc3_tsrm050
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc3_tsrm070
          - S4_F2_t18_U4_az600_open_solid_medium_b34s16_rotc3_tsrm050
          - S4_F2_t18_U4_az1200_open_solid_medium_b34s16_rotc3_tsrm050
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc4_tsrm030
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc4_tsrm050
          - S4_F2_t18_U4_az000_open_solid_medium_b34s16_rotc4_tsrm070
          - S4_F2_t18_U4_az400_open_solid_medium_b34s16_rotc4_tsrm050
          - S4_F2_t18_U4_az800_open_solid_medium_b34s16_rotc4_tsrm050
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFOAM 12
        run: |
          sudo sh -c "wget -qO - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update -qq && sudo apt-get install -y openfoam12
      - name: Build the parametric rotors
        run: python3 -m pip install --quiet numpy && cd geometry && python3 build_fins.py
        working-directory: ${{ env.ROOT }}
      - name: Mesh and solve ${{ matrix.case }}
        run: |
          set +e
          source /opt/openfoam12/etc/bashrc
          set -e
          python3 make_sweep.py --create --only=${{ matrix.case }}
          cd runs/${{ matrix.case }}
          foamDictionary system/caseParams -entry LVL   -set 4
          foamDictionary system/caseParams -entry LVL_1 -set 3
          foamDictionary system/caseParams -entry LVL_2 -set 2
          foamDictionary system/caseParams -entry LVL_3 -set 1
          foamDictionary system/controlDict -entry endTime -set 1500
          cat constant/MRFProperties
          chmod +x Allrun
          set +e
          ./Allrun --run 1
          rc=$?
          set -e
          grep -E "cellZoneSet rotor now size" log.topoSet || true
          if [ $rc -ne 0 ]; then
            echo "::error::case failed (rc=$rc)"
            for l in log.topoSet log.checkMesh log.foamRun; do
              [ -f "$l" ] && { echo "---- tail of $l ----"; tail -40 "$l"; }
            done
            exit $rc
          fi
        working-directory: ${{ env.ROOT }}/sweep
      - name: Summary and acceptance gates
        if: always()
        run: python3 summarize_run.py runs/${{ matrix.case }} || true
        working-directory: ${{ env.ROOT }}/sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage4-${{ matrix.case }}
          path: |
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/log.*
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/run_summary.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/case_params.json
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/constant/MRFProperties
            cvwt-upload-to-github/cfd/stage1/sweep/runs/*/postProcessing/**
          retention-days: 30

  torque:
    needs: rotor
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stage4-*
          path: dl
      - name: Power and ripple per rotor
        run: |
          mkdir -p runs
          for d in dl/*/; do
            for c in "$d"*/; do [ -d "$c" ] && cp -r "$c" runs/; done
          done
          ls runs
          python3 cvwt-upload-to-github/cfd/stage1/sweep/rotor_design_summary.py runs 500 | tee design.txt
          { echo '## Stage 4 combined rotors'; echo '```'; cat design.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
